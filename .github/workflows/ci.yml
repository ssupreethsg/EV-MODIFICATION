name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Python lint (ruff)
        if: matrix.compiler == 'gcc'
        run: pip install -r requirements-dev.txt && ruff check tools tests && ruff format --check tools tests
      - run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DEV_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  package:
    name: "Consumer (${{ matrix.os }}, find_package and add_subdirectory)"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the package into a prefix
        run: |
          cmake -S . -B build -DEV_PYTHON_TESTS=OFF
          cmake --build build --config Release
          cmake --install build --config Release --prefix "$RUNNER_TEMP/ev_prefix"
      - name: Consumer via find_package(ev_modify 2.0 REQUIRED)
        run: |
          cmake -S tests/consumer -B consumer_pkg -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/ev_prefix"
          cmake --build consumer_pkg --config Release
          ctest --test-dir consumer_pkg -C Release --output-on-failure
      - name: Consumer via add_subdirectory
        run: |
          cmake -S tests/consumer -B consumer_sub -DEV_CONSUMER_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build consumer_sub --config Release
          ctest --test-dir consumer_sub -C Release --output-on-failure

  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: cmake -S . -B build -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug -DEV_SANITIZE=ON -DEV_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: cmake -S . -B build -DEV_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  cortex-m4:
    name: Cross-compile (Cortex-M4F)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build the library for the target MCU
        run: |
          arm-none-eabi-gcc -std=c11 -O2 -mcpu=cortex-m4 -mfpu=fpv4-sp-d16 -mfloat-abi=hard -mthumb \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wdouble-promotion -Werror \
            -Isrc -c src/ev_modify.c -o ev_modify_cm4.o
          arm-none-eabi-size ev_modify_cm4.o
          text=$(arm-none-eabi-size ev_modify_cm4.o | awk 'NR==2 {print $1}')
          echo "text size: $text bytes (limit 22000)"
          test "$text" -le 22000
      - name: Link a tiny main against newlib (catches missing libm and soft-float symbols)
        run: |
          arm-none-eabi-gcc -std=c11 -O2 -mcpu=cortex-m4 -mfpu=fpv4-sp-d16 -mfloat-abi=hard -mthumb \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wdouble-promotion -Werror \
            -Isrc src/ev_modify.c tests/cm4/main.c -specs=nosys.specs -lm -o ev_modify_cm4.elf
          arm-none-eabi-size ev_modify_cm4.elf

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: cppcheck --enable=warning,portability,performance --std=c11 --error-exitcode=1 --inline-suppr -q -Isrc src tools/ev_cli.c tests/test_solver.c

  coverage:
    name: Coverage (>= 95 % of the controller)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="--coverage -O0" -DEV_PYTHON_TESTS=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: Check line coverage of src/ev_modify.c
        run: |
          cd build
          report=$(gcov -o CMakeFiles/ev_modify.dir/src/ev_modify.c.gcda "$GITHUB_WORKSPACE/src/ev_modify.c")
          echo "$report"
          percent=$(echo "$report" | grep -m1 -oP 'Lines executed:\K[0-9.]+')
          python3 -c "import sys; sys.exit(0 if float('$percent') >= 95.0 else 1)"

  pybamm-validation:
    name: PyBaMM validation (OCV, EKF, DFN plating)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-benchmark.txt
      - run: cmake -S . -B build -DEV_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build
      - name: CTest, including the PyBaMM stoichiometry cross-check
        run: ctest --test-dir build --output-on-failure
      - name: Validate against PyBaMM
        run: python tools/run_pybamm_sim.py --cli build/ev_cli --out build/pybamm_benchmark.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pybamm-benchmark
          path: build/pybamm_benchmark.png
